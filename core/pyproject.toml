[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "project-state-python-candidate"
version = "0.1.0a49"
description = "Local project state snapshot and explicitly supported restore candidate"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "project-state contributors" }]
dependencies = []

[project.scripts]
project-state = "project_state.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["project_state*"]

